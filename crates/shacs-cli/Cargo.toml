[package]
name = "shacs-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
shacs-api = { path = "../shacs-api" }
shacs-channels = { path = "../shacs-channels" }
shacs-command = { path = "../shacs-command" }
shacs-config = { path = "../shacs-config" }
shacs-core = { path = "../shacs-core" }
shacs-projection = { path = "../shacs-projection" }
shacs-providers = { path = "../shacs-providers" }
shacs-redaction = { path = "../shacs-redaction" }
shacs-session = { path = "../shacs-session" }
shacs-skills = { path = "../shacs-skills" }
shacs-templates = { path = "../shacs-templates" }
shacs-utils = { path = "../shacs-utils" }
shacs-web = { path = "../shacs-web" }
shacs-workflow = { path = "../shacs-workflow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "signal", "time"] }
tungstenite = { version = "=0.26.2", features = ["native-tls"] }
ureq = { version = ">=3.2.1, <3.3.0", features = ["charset"] }
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
imap = "=2.4.1"
mailparse = "0.16"
native-tls = "0.2"
libc = "0.2"
fs2 = "0.4"

[features]
spec031-test-fixture = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "shacs-bot"
path = "src/main.rs"

[[example]]
name = "spec031_surface_approval_fixture"
path = "examples/spec031_surface_approval_fixture.rs"
required-features = ["spec031-test-fixture"]
