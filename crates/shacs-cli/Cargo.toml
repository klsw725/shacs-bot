[package]
name = "shacs-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
shacs-api = { path = "../shacs-api" }
shacs-channels = { path = "../shacs-channels" }
shacs-config = { path = "../shacs-config" }
shacs-core = { path = "../shacs-core" }
shacs-providers = { path = "../shacs-providers" }
shacs-skills = { path = "../shacs-skills" }
shacs-templates = { path = "../shacs-templates" }
shacs-utils = { path = "../shacs-utils" }
shacs-web = { path = "../shacs-web" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "signal", "time"] }
ureq = { version = ">=3.2.1, <3.3.0", features = ["charset"] }
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
imap = "=2.4.1"
mailparse = "0.16"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "shacs-bot"
path = "src/main.rs"
