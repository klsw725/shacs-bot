[package]
name = "shacs-heartbeat"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shacs-providers = { path = "../shacs-providers" }
shacs-utils = { path = "../shacs-utils" }

[dev-dependencies]
tempfile = "3"
