[package]
name = "shacs-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shacs-redaction = { path = "../shacs-redaction" }

[dev-dependencies]
tempfile = "3"
