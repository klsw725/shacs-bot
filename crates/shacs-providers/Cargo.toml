[package]
name = "shacs-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
httpdate = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shacs-config = { path = "../shacs-config" }
ureq = { version = ">=3.2.1, <3.3.0", features = ["charset"] }
