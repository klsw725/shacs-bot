[workspace]
members = [
    "shacs-api",
    "shacs-app",
    "shacs-bus",
    "shacs-channels",
    "shacs-cli",
    "shacs-command",
    "shacs-config",
    "shacs-core",
    "shacs-cron",
    "shacs-eval",
    "shacs-heartbeat",
    "shacs-projection",
    "shacs-providers",
    "shacs-redaction",
    "shacs-security",
    "shacs-session",
    "shacs-skills",
    "shacs-templates",
    "shacs-tui",
    "shacs-utils",
    "shacs-web",
    "shacs-workflow",
]
resolver = "2"

[profile.dev]
debug = 0

[profile.dev.package.sha2]
opt-level = 3

[profile.test]
debug = 0

[profile.test.package.sha2]
opt-level = 3
