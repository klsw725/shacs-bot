[workspace]
members = [
    "shacs-api",
    "shacs-bus",
    "shacs-channels",
    "shacs-cli",
    "shacs-command",
    "shacs-config",
    "shacs-core",
    "shacs-cron",
    "shacs-eval",
    "shacs-heartbeat",
    "shacs-projection",
    "shacs-providers",
    "shacs-redaction",
    "shacs-security",
    "shacs-session",
    "shacs-skills",
    "shacs-templates",
    "shacs-tui",
    "shacs-utils",
    "shacs-web",
    "shacs-workflow",
]
resolver = "2"

# Google Rust style guide checks (https://google.github.io/styleguide/rustguide.html).
# Disallowed methods are configured in clippy.toml.
[workspace.lints.clippy]
missing_panics_doc = "warn"
needless_for_each = "warn"
ref_option = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

[profile.dev]
debug = 0

[profile.dev.package.sha2]
opt-level = 3

[profile.test]
debug = 0

[profile.test.package.sha2]
opt-level = 3
