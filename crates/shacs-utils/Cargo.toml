[package]
name = "shacs-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shacs-redaction = { path = "../shacs-redaction" }
ureq = { version = ">=3.2.1, <3.3.0", features = ["charset"] }
zip = "2"
