[package]
name = "shacs-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
cap-primitives = "4.0.2"
glob = "0.3"
libc = "0.2"
fs2 = "0.4"
nix = { version = "0.30", features = ["event", "process", "signal"] }
regex = "1"
rustix = { version = "1.1.4", features = ["fs"] }
base64 = "0.22"
boa_engine = "=0.21.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
shacs-app = { path = "../shacs-app" }
shacs-cron = { path = "../shacs-cron" }
shacs-command = { path = "../shacs-command" }
shacs-bus = { path = "../shacs-bus" }
shacs-config = { path = "../shacs-config" }
shacs-eval = { path = "../shacs-eval" }
shacs-heartbeat = { path = "../shacs-heartbeat" }
shacs-providers = { path = "../shacs-providers" }
shacs-projection = { path = "../shacs-projection" }
shacs-redaction = { path = "../shacs-redaction" }
shacs-security = { path = "../shacs-security" }
shacs-session = { path = "../shacs-session" }
shacs-skills = { path = "../shacs-skills" }
shacs-templates = { path = "../shacs-templates" }
shacs-utils = { path = "../shacs-utils" }
shacs-workflow = { path = "../shacs-workflow" }
ureq = { version = ">=3.2.1, <3.3.0", features = ["charset"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
security-framework-sys = "2.17.0"

[dev-dependencies]
filetime = "0.2"

[[test]]
name = "spec034_release_runner"
path = "tests/spec034_release_runner.rs"
test = false
