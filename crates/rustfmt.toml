# Google Rust style guide formatting settings:
# https://google.github.io/styleguide/rustguide.html#use-the-appropriate-formatting-tool
#
# The guide also asks for `imports_granularity = "Module"` and
# `format_macro_matchers = true`. Stable rustfmt ignores both in this file, so
# they are passed on the command line instead (see AGENTS.md):
#   cargo fmt --manifest-path crates/Cargo.toml --all -- --config imports_granularity=Module,format_macro_matchers=true
max_width = 100
hex_literal_case = "Lower"
