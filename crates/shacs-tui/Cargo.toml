[package]
name = "shacs-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
serde_json = "1"
shacs-config = { path = "../shacs-config" }
shacs-core = { path = "../shacs-core" }
shacs-projection = { path = "../shacs-projection" }
shacs-session = { path = "../shacs-session" }
shacs-workflow = { path = "../shacs-workflow" }
unicode-width = "0.1"

[dev-dependencies]
shacs-cli = { path = "../shacs-cli", features = ["spec031-test-fixture"] }
tempfile = "3"

[[bin]]
name = "shacs-tui"
path = "src/main.rs"
