<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>shacs-bot 화면 보기</title>
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: #1b1b1b; color: #eee; font: 14px/1.4 sans-serif; }
#screen { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; }
#paste { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; padding: 8px; border-top: 1px solid #444; }
#paste input, #paste textarea, #paste button { font: inherit; padding: 4px 6px; box-sizing: border-box; }
#paste-password { width: 14em; }
#paste-text { flex: 1 1 20em; height: 3.2em; resize: vertical; }
#paste-status { flex: 1 1 100%; margin: 0; min-height: 1.4em; color: #bbb; }
</style>
</head>
<body>
<iframe id="screen" title="브라우저 화면" src="vnc.html?path=websockify%3Ftoken%3Dview&amp;resize=scale"></iframe>
<form id="paste" autocomplete="off">
<input id="paste-password" type="password" autocomplete="off" placeholder="화면 보기 비밀번호" aria-label="화면 보기 비밀번호">
<textarea id="paste-text" placeholder="브라우저에 붙여넣을 글" aria-label="브라우저에 붙여넣을 글"></textarea>
<button id="paste-send" type="submit">보내기</button>
<p id="paste-status" role="status">넘겨받은 동안 여기에 쓴 글이 브라우저의 입력 칸에 들어갑니다.</p>
</form>
<script>
"use strict";
(function () {
  var form = document.getElementById("paste");
  var password = document.getElementById("paste-password");
  var text = document.getElementById("paste-text");
  var send = document.getElementById("paste-send");
  var status = document.getElementById("paste-status");
  var encoder = new TextEncoder();
  var decoder = new TextDecoder();
  var LIMIT = 20000;
  var MESSAGES = {
    "error auth": "비밀번호가 맞지 않습니다.",
    "error not_user": "지금은 넘겨받은 상태가 아닙니다.",
    "error too_long": "글이 너무 깁니다.",
    "error invalid_text": "넣을 수 없는 글자가 있습니다.",
    "error browser_closed": "브라우저가 닫혔습니다."
  };

  var K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  // SHA-256 in the page itself: the browser's own digest is missing on a
  // plain-http address that is not this machine, and nothing is fetched
  // from outside.
  function sha256Hex(bytes) {
    var h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var length = bytes.length;
    var padded = new Uint8Array(((length + 9 + 63) >> 6) << 6);
    padded.set(bytes);
    padded[length] = 0x80;
    var view = new DataView(padded.buffer);
    view.setUint32(padded.length - 8, Math.floor(length / 0x20000000));
    view.setUint32(padded.length - 4, (length << 3) >>> 0);
    var w = new Uint32Array(64);
    function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
    for (var offset = 0; offset < padded.length; offset += 64) {
      var i;
      for (i = 0; i < 16; i++) { w[i] = view.getUint32(offset + i * 4); }
      for (i = 16; i < 64; i++) {
        var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (i = 0; i < 64; i++) {
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0; h[3] = (h[3] + d) >>> 0;
      h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
    }
    return h.map(function (word) { return ("00000000" + word.toString(16)).slice(-8); }).join("");
  }

  function say(message) { status.textContent = message; }

  // One connection carries one authentication and one text, then the
  // server closes it. Every send opens a new one.
  function paste(secret, body) {
    var scheme = location.protocol === "https:" ? "wss:" : "ws:";
    var socket = new WebSocket(scheme + "//" + location.host + "/websockify?token=paste");
    var received = "";
    var step = "greeting";
    var finished = false;
    socket.binaryType = "arraybuffer";

    function finish(message, sent) {
      if (finished) { return; }
      finished = true;
      send.disabled = false;
      if (sent) { text.value = ""; }
      say(message);
      socket.close();
    }

    function line(value) {
      if (step === "greeting") {
        var parts = value.split(" ");
        if (parts.length !== 4 || parts[0] !== "shacs-paste" || parts[1] !== "1") {
          finish("붙여넣기에 연결하지 못했습니다.", false);
          return;
        }
        step = "auth";
        var digest = sha256Hex(encoder.encode("shacs-paste-v1\n" + parts[3] + "\n" + secret));
        socket.send(encoder.encode("auth " + digest + "\n"));
      } else if (step === "auth") {
        if (value !== "ok") {
          finish(MESSAGES[value] || "붙여넣지 못했습니다.", false);
          return;
        }
        step = "paste";
        var head = encoder.encode("paste " + body.length + "\n");
        var message = new Uint8Array(head.length + body.length);
        message.set(head);
        message.set(body, head.length);
        socket.send(message);
      } else if (value === "done") {
        finish("붙여넣었습니다.", true);
      } else {
        finish(MESSAGES[value] || "붙여넣지 못했습니다.", false);
      }
    }

    socket.onmessage = function (event) {
      if (typeof event.data === "string") {
        received += event.data;
      } else {
        received += decoder.decode(new Uint8Array(event.data), { stream: true });
      }
      var end;
      while (!finished && (end = received.indexOf("\n")) >= 0) {
        var value = received.slice(0, end);
        received = received.slice(end + 1);
        line(value);
      }
    };
    socket.onerror = function () {
      finish("붙여넣기에 연결하지 못했습니다. 넘겨받은 동안에만 쓸 수 있습니다.", false);
    };
    socket.onclose = function () {
      finish("붙여넣기 연결이 끊겼습니다. 넘겨받은 동안에만 쓸 수 있습니다.", false);
    };
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var secret = password.value;
    var body = encoder.encode(text.value.replace(/\r\n/g, "\n"));
    if (!secret) { say("화면 보기 비밀번호를 넣으세요."); return; }
    if (body.length === 0) { say("붙여넣을 글을 쓰세요."); return; }
    if (body.length > LIMIT) { say(MESSAGES["error too_long"]); return; }
    send.disabled = true;
    say("보내는 중입니다.");
    paste(secret, body);
  });
}());
</script>
</body>
</html>
